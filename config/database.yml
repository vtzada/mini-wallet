default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  username: postgres
  password: 123

development:
  <<: *default
  database: wallet_api_development

test:
  <<: *default
  database: wallet_api_test

production:
  primary: &primary_production
    <<: *default
    database: wallet_api_production
    username: wallet_api
    password: <%= ENV["WALLET_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: wallet_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: wallet_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: wallet_api_production_cable
    migrations_paths: db/cable_migrate